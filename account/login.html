<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADsP 로그인 / 회원가입</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>로그인 / 회원가입</h1>
      <p>정적 사이트용 로컬 계정입니다. 학습기록은 이 브라우저의 localStorage에 계정별로 저장됩니다.</p>
      <div class="top-actions">
        <a class="button secondary" href="../index.html">메인으로 돌아가기</a>
        <a class="button secondary" href="./profile.html">내 학습기록</a>
      </div>
    </div>
  </header>

  <main class="container auth-page">
    <section class="section notice">
      <h2>안내</h2>
      <p>이 로그인은 서버 인증이 아닙니다. 같은 브라우저에서 학습기록을 구분하기 위한 로컬 기능이며, 비밀번호 재설정과 기기 간 동기화는 제공하지 않습니다.</p>
    </section>

    <section class="section auth-grid">
      <form class="card auth-form" id="loginForm">
        <h2>로그인</h2>
        <label>아이디
          <input type="text" id="loginUsername" autocomplete="username" required>
        </label>
        <label>비밀번호
          <input type="password" id="loginPassword" autocomplete="current-password" required>
        </label>
        <button type="submit" class="primary">로그인</button>
      </form>

      <form class="card auth-form" id="signupForm">
        <h2>회원가입</h2>
        <label>아이디
          <input type="text" id="signupUsername" autocomplete="username" placeholder="영문/숫자 3자 이상" required>
        </label>
        <label>표시 이름
          <input type="text" id="signupDisplayName" autocomplete="nickname" placeholder="선택">
        </label>
        <label>비밀번호
          <input type="password" id="signupPassword" autocomplete="new-password" required>
        </label>
        <button type="submit" class="primary">회원가입</button>
      </form>
    </section>

    <p id="authMessage" class="result-line"></p>
  </main>

  <script src="../assets/auth.js"></script>
  <script>
    (function () {
      "use strict";

      var message = document.getElementById("authMessage");

      function show(text, ok) {
        message.textContent = text;
        message.className = ok ? "result-line status-ok" : "result-line status-bad";
      }

      document.getElementById("loginForm").addEventListener("submit", function (event) {
        event.preventDefault();
        try {
          window.ADSPAuth.login(
            document.getElementById("loginUsername").value,
            document.getElementById("loginPassword").value
          );
          show("로그인되었습니다. 내 학습기록으로 이동합니다.", true);
          location.href = "./profile.html";
        } catch (error) {
          show(error.message, false);
        }
      });

      document.getElementById("signupForm").addEventListener("submit", function (event) {
        event.preventDefault();
        try {
          window.ADSPAuth.signUp(
            document.getElementById("signupUsername").value,
            document.getElementById("signupPassword").value,
            document.getElementById("signupDisplayName").value
          );
          show("회원가입이 완료되었습니다. 내 학습기록으로 이동합니다.", true);
          location.href = "./profile.html";
        } catch (error) {
          show(error.message, false);
        }
      });
    })();
  </script>
</body>
</html>
