<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADsP 내 학습기록</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1>내 학습기록</h1>
      <p>로그인한 로컬 계정 기준으로 저장된 ADsP 풀이 기록을 확인합니다.</p>
      <div class="top-actions">
        <a class="button secondary" href="../index.html">메인으로 돌아가기</a>
        <a class="button secondary" href="../stats/study-record.html">상세 학습기록</a>
        <a class="button secondary" href="../review/wrong-notes.html">오답노트</a>
        <a class="button primary" href="../cbt/adsp_basic_cbt.html">CBT 풀기</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section" id="profileArea"></section>
  </main>

  <script src="../assets/storage.js"></script>
  <script src="../assets/auth.js"></script>
  <script>
    (function () {
      "use strict";

      function rate(correct, total) {
        return total ? Math.round((correct / total) * 100) + "%" : "0%";
      }

      function formatDate(value) {
        return value ? new Date(value).toLocaleString("ko-KR") : "-";
      }

      function render() {
        var user = window.ADSPAuth.getCurrentUser();
        var area = document.getElementById("profileArea");
        if (!user) {
          area.innerHTML = '<div class="empty">로그인된 계정이 없습니다. <a class="button primary" href="./login.html">로그인/회원가입</a></div>';
          return;
        }
        var data = window.ADSPStorage.getStudyData();
        area.innerHTML = [
          '<div class="notice"><h2>' + escapeHtml(user.displayName || user.username) + '</h2><p>아이디: ' + escapeHtml(user.username) + '</p><p>로그인 시간: ' + formatDate(user.loggedInAt) + '</p></div>',
          '<div class="stats-grid section">',
          '<div class="metric"><strong>' + data.totalAnswered + '</strong><span>총 풀이 수</span></div>',
          '<div class="metric"><strong>' + data.correctCount + '</strong><span>정답 수</span></div>',
          '<div class="metric"><strong>' + data.wrongCount + '</strong><span>오답 수</span></div>',
          '<div class="metric"><strong>' + rate(data.correctCount, data.totalAnswered) + '</strong><span>정답률</span></div>',
          '<div class="metric"><strong>' + Object.keys(data.wrongQuestions || {}).length + '</strong><span>현재 오답노트</span></div>',
          '</div>',
          '<div class="toolbar"><a class="button primary" href="../stats/study-record.html">상세 기록 보기</a><a class="button secondary" href="../review/wrong-notes.html">오답노트 보기</a><button type="button" id="logoutButton" class="danger">로그아웃</button></div>',
          '<p class="footer-note">이 계정과 기록은 현재 브라우저에만 저장됩니다. 브라우저 데이터 삭제 시 사라질 수 있습니다.</p>'
        ].join("");
        document.getElementById("logoutButton").addEventListener("click", function () {
          window.ADSPAuth.logout();
          location.href = "./login.html";
        });
      }

      function escapeHtml(value) {
        return String(value == null ? "" : value)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      render();
    })();
  </script>
</body>
</html>
