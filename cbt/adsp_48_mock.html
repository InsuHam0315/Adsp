<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADsP 48회 복원 모의고사</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 id="pageTitle">ADsP 48회 복원 모의고사</h1>
      <p>source에 추가된 48회 복원 MD를 바탕으로 정답은 유지하고, 4지선다 선지는 중상 난이도로 재구성한 CBT입니다.</p>
      <div class="top-actions">
        <a class="button secondary" href="../index.html">메인으로 돌아가기</a>
        <a class="button secondary" href="./adsp_mock_01.html">모의고사 1회</a>
        <a class="button secondary" href="../review/wrong-notes.html">오답노트</a>
        <a class="button secondary" href="../stats/study-record.html">학습기록</a>
        <a class="button secondary" href="../account/login.html">로그인/회원가입</a>
      </div>
      <div class="auth-status" data-auth-status data-login="../account/login.html" data-profile="../account/profile.html"></div>
    </div>
  </header>

  <main class="container">
    <section class="section notice">
      <h2>출처와 구성</h2>
      <p>문제와 정답은 <strong>source/48회 ADsP 1과목 복원 문제.md</strong> 기반입니다. 원본 MD에 선지가 없는 문항은 정답을 기준으로 오답 선지를 새로 구성했습니다.</p>
    </section>

    <section class="section">
      <div class="toolbar">
        <label>과목 필터
          <select id="subjectFilter"></select>
        </label>
        <label>카테고리 필터
          <select id="categoryFilter"></select>
        </label>
        <div class="segmented" aria-label="보기 방식">
          <button type="button" id="singleMode">한 문제씩 보기</button>
          <button type="button" id="allMode">전체 문제 풀기</button>
        </div>
        <button type="button" id="prevQuestion">이전</button>
        <button type="button" id="nextQuestion">다음</button>
        <button type="button" id="scoreButton" class="primary">점수 계산</button>
        <button type="button" id="resetButton">다시 풀기</button>
      </div>
      <p id="cbtSummary" class="result-line"></p>
      <p id="scoreResult" class="result-line"></p>
      <div id="numberNav" class="number-nav" aria-label="문제 번호 이동"></div>
      <div id="questionShell" class="question-shell"></div>
    </section>
  </main>

  <script src="../assets/storage.js"></script>
  <script src="../data/adsp_48_questions.js"></script>
  <script>
    window.ADSP_CBT_CONFIG = {
      title: "ADsP 48회 복원 모의고사",
      questions: window.ADSP_48_QUESTIONS
    };
  </script>
  <script src="../assets/cbt.js"></script>
  <script src="../assets/auth.js"></script>
</body>
</html>
