<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADsP 모의고사 1회</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <h1 id="pageTitle">ADsP 모의고사 1회</h1>
      <p>실제 시험 흐름에 맞춘 50문항 모의고사입니다. 정답 확인 시 오답노트와 학습기록에 자동 반영됩니다.</p>
      <div class="top-actions">
        <a class="button secondary" href="../index.html">메인으로 돌아가기</a>
        <a class="button secondary" href="../review/wrong-notes.html">오답노트로 이동</a>
        <a class="button secondary" href="../stats/study-record.html">학습기록으로 이동</a>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="section">
      <div class="toolbar">
        <label>과목 필터
          <select id="subjectFilter"></select>
        </label>
        <label>카테고리 필터
          <select id="categoryFilter"></select>
        </label>
        <div class="segmented" aria-label="보기 방식">
          <button type="button" id="singleMode">한 문제씩 보기</button>
          <button type="button" id="allMode">전체 문제 풀기</button>
        </div>
        <button type="button" id="prevQuestion">이전</button>
        <button type="button" id="nextQuestion">다음</button>
        <button type="button" id="scoreButton" class="primary">점수 계산</button>
        <button type="button" id="resetButton">다시 풀기</button>
      </div>
      <p id="cbtSummary" class="result-line"></p>
      <p id="scoreResult" class="result-line"></p>
      <div id="numberNav" class="number-nav" aria-label="문제 번호 이동"></div>
      <div id="questionShell" class="question-shell"></div>
    </section>
  </main>

  <script src="../assets/storage.js"></script>
  <script src="../data/adsp_mock_01_questions.js"></script>
  <script>
    window.ADSP_CBT_CONFIG = {
      title: "ADsP 모의고사 1회",
      questions: window.ADSP_MOCK_01_QUESTIONS
    };
  </script>
  <script src="../assets/cbt.js"></script>
</body>
</html>
